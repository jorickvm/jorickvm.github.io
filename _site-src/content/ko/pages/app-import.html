<main class="app-import" data-app-import data-file-name="atlasdays-stays.csv">
  <img class="logo logo-dark" src="/assets/brand/logo_dark.png?v=20260325a" alt="AtlasDays 로고" width="1024" height="1024" />
  <img class="logo logo-light" src="/assets/brand/logo_light.png?v=20260325a" alt="AtlasDays 로고" width="1024" height="1024" />
  <h1>AtlasDays에서 열 체류 기록이 준비되었습니다</h1>
  <div data-app-import-ready>
    <p class="lead">이 iPhone에는 아직 AtlasDays가 없습니다. 무료로 받은 다음 이 페이지로 돌아와 'AtlasDays에서 열기'를 누르십시오.</p>
    <div class="actions">
      <a class="btn btn-primary" href="https://apps.apple.com/app/atlasdays-track-country-days/id6760133544">App Store에서 AtlasDays 받기</a>
      <a class="btn" data-app-import-open href="https://go.atlasdays.app/import/">AtlasDays에서 열기</a>
    </div>
    <p class="sub">또는 <button type="button" class="link-button" data-app-import-download>파일을 다운로드</button>해 AtlasDays에서 여십시오.</p>
  </div>
  <p class="lead" data-app-import-empty hidden>이 링크에는 체류 기록이 없습니다. 계산기로 돌아가 'AtlasDays에서 관리하기'를 다시 누르십시오.</p>
  <p class="sub note">체류 기록은 이 페이지의 주소에만 담기며 서버로 전송되지 않습니다.</p>
</main>
