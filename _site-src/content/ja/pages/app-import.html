<main class="app-import" data-app-import data-file-name="atlasdays-stays.csv">
  <img class="logo logo-dark" src="/assets/brand/logo_dark.png?v=20260325a" alt="AtlasDaysのロゴ" width="1024" height="1024" />
  <img class="logo logo-light" src="/assets/brand/logo_light.png?v=20260325a" alt="AtlasDaysのロゴ" width="1024" height="1024" />
  <h1>滞在をAtlasDaysで開く準備ができました</h1>
  <div data-app-import-ready>
    <p class="lead">このiPhoneにはまだAtlasDaysがありません。無料で入手してからこのページに戻り、「AtlasDaysで開く」をタップしてください。</p>
    <div class="actions">
      <a class="btn btn-primary" href="https://apps.apple.com/app/atlasdays-track-country-days/id6760133544">App StoreでAtlasDaysを入手</a>
      <a class="btn" data-app-import-open href="https://go.atlasdays.app/import/">AtlasDaysで開く</a>
    </div>
    <p class="sub">または<button type="button" class="link-button" data-app-import-download>ファイルをダウンロード</button>して、AtlasDaysで開いてください。</p>
  </div>
  <p class="lead" data-app-import-empty hidden>このリンクには滞在が含まれていません。計算機に戻り、もう一度「AtlasDaysで記録する」をタップしてください。</p>
  <p class="sub note">滞在のデータはこのページのアドレスにだけ含まれ、サーバーに送信されることはありません。</p>
</main>
