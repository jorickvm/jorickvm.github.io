<main class="app-import" data-app-import data-file-name="atlasdays-stays.csv">
  <img class="logo logo-dark" src="/assets/brand/logo_dark.png?v=20260325a" alt="AtlasDays 標誌" width="1024" height="1024" />
  <img class="logo logo-light" src="/assets/brand/logo_light.png?v=20260325a" alt="AtlasDays 標誌" width="1024" height="1024" />
  <h1>停留紀錄已可匯入 AtlasDays</h1>
  <div data-app-import-ready>
    <p class="lead">這支 iPhone 還沒有安裝 AtlasDays。請先免費下載，再回到這個頁面，輕點「在 AtlasDays 中開啟」。</p>
    <div class="actions">
      <a class="btn btn-primary" href="https://apps.apple.com/app/atlasdays-track-country-days/id6760133544">在 App Store 取得 AtlasDays</a>
      <a class="btn" data-app-import-open href="https://go.atlasdays.app/import/">在 AtlasDays 中開啟</a>
    </div>
    <p class="sub">也可以<button type="button" class="link-button" data-app-import-download>下載檔案</button>，再用 AtlasDays 開啟。</p>
  </div>
  <p class="lead" data-app-import-empty hidden>這個連結裡沒有停留紀錄。請回到計算器，再輕點一次「在 AtlasDays 中繼續追蹤」。</p>
  <p class="sub note">停留紀錄只存在於這個頁面的網址中，絕不會傳送到伺服器。</p>
</main>
