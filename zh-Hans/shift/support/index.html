    <div class="policy">
      <p class="lede">获取 Shift 使用帮助，或直接向开发者提交反馈。</p>

      <section>
        <h2>联系</h2>
        <p>请发送邮件至 <a href="mailto:shift@atlasdays.app?subject=Shift%20%E6%94%AF%E6%8C%81">shift@atlasdays.app</a>。报告问题时，请附上 Shift 版本、设备型号、iOS 或 iPadOS 版本，以及导致问题的操作步骤。</p>
      </section>

      <section>
        <h2>数据</h2>
        <p>Shift 不设账户，也不使用云服务。训练历史、设置和当前计时器状态只保存在设备上。详情请参阅 <a href="/zh-Hans/shift/privacy/">Shift 隐私政策</a>。</p>
      </section>
    </div>
