<body>
  <main>
    <header>
      <svg class="dots" viewBox="0 0 283 67" aria-hidden="true">
        <circle cx="33.5" cy="33.5" r="33.5" fill="#00af7e" />
        <circle cx="141.5" cy="33.5" r="33.5" fill="#e44151" />
        <circle cx="249.5" cy="33.5" r="33.5" fill="#f5a216" />
      </svg>
      <h1>Shift 隐私政策</h1>
    </header>

    <div class="policy">
      <p class="lede">Shift 不收集或传输个人数据。</p>

      <section>
        <h2>数据收集</h2>
        <p>Shift 不收集、存储、传输或分享个人信息。App 不设账户，不含广告、分析或跟踪技术，也不使用收集数据的第三方服务。</p>
      </section>

      <section>
        <h2>设备上的数据</h2>
        <p>训练、历史记录、设置和计时器状态仅保存在设备上。语音提示由 AI 生成，并在本地播放。</p>
      </section>

      <section>
        <h2>保留与删除</h2>
        <p>由于开发者不会收到任何数据，因此没有由开发者保留或删除的数据。删除 App 即可从设备上移除 Shift 存储在本地的数据。</p>
      </section>

      <section id="contact">
        <h2>联系与支持</h2>
        <p>如需 Shift 使用帮助、提交反馈，或对本隐私政策有疑问，请联系 <a href="mailto:shift@atlasdays.app?subject=Shift%20%E6%94%AF%E6%8C%81">shift@atlasdays.app</a>。</p>
      </section>
    </div>
  </main>
