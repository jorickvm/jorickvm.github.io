name: Site audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * 1"
  # Lets the source monitor be run on demand from the Actions tab rather than
  # only on the Monday cron.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # editorial.json, content-clusters.json, and EDITORIAL_REVIEW_QUEUE.md
      # used to be git-ignored and fetched from the private repo with a PAT
      # before every run. They are committed since August 2026: all three are
      # deterministic output of the public build_content_governance.py over the
      # public articles.json. Every check now runs from the checkout alone, on
      # fork PRs and the weekly cron included.
      - name: Audit committed site
        run: python3 scripts/audit_site.py --strict-semantics --check-baseline _site-src/data/baseline.json
      # Terminology, structural parity with the English source, and typography
      # for every translated page. Runs before the build because there is no
      # point rendering a page that will not pass. glossary.json is a committed
      # snapshot of the app repo's shipped strings, so this needs no checkout
      # of that repo; scripts/sync_glossary.py refreshes it.
      - name: Check translations
        run: python3 scripts/check_translations.py --check
      # Separate from the check above because it asks a different question:
      # that one verifies a translation has the right shape, this one verifies
      # the words actually changed. A fully English fragment passes every other
      # gate, which is how the Spanish Learn hub shipped with English filter
      # pills and headings.
      - name: Check for untranslated text
        run: python3 scripts/check_untranslated.py --check
      - name: Check generated article output
        run: |
          python3 scripts/build_residency_hub.py --check
          python3 scripts/build_site.py --check
          python3 scripts/build_route_outputs.py --check
      - name: Check generated governance and search data
        run: |
          python3 scripts/build_content_governance.py --check
          python3 scripts/build_search_index.py --check
          python3 scripts/sync_help_screenshots.py --check
          python3 scripts/check_external_sources.py --check-config
      - name: Check social cards
        run: python3 scripts/generate_social_cards.py --check
      - name: Test audit tooling
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

  # Weekly link rot on the official sources the articles cite. The report used
  # to go only to an artifact, which nobody opens, so a dead government page
  # could sit uncorrected indefinitely on a site whose credibility rests on
  # those citations. It now maintains a single issue: opened when sources need
  # review, edited in place on later runs, and closed when everything resolves
  # again. One issue rather than one per run, so it stays signal.
  source-monitor:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check official sources
        run: python3 scripts/check_external_sources.py --output external-source-report.json
      - name: Render findings
        id: findings
        run: python3 scripts/report_source_health.py --report external-source-report.json --body source-issue.md
      - name: Open, update, or close the review issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTIONABLE: ${{ steps.findings.outputs.actionable }}
        run: |
          set -euo pipefail
          gh label create source-monitor --description "Weekly official-source link check" --color BFD4F2 2>/dev/null || true
          existing="$(gh issue list --state open --label source-monitor --limit 1 --json number --jq '.[0].number // empty')"
          if [ "${ACTIONABLE:-0}" -gt 0 ]; then
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --body-file source-issue.md
              echo "Updated issue #$existing with $ACTIONABLE finding(s)."
            else
              gh issue create --title "Official sources need review" --body-file source-issue.md --label source-monitor
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Every cited source resolved cleanly on this run. Closing automatically."
            echo "Closed issue #$existing."
          else
            echo "All sources clean; nothing to report."
          fi
      - name: Upload classified source report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-source-report
          path: external-source-report.json
          if-no-files-found: warn
