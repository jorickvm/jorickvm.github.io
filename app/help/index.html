<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,follow" />
  <link rel="canonical" href="https://atlasdays.app/help/" />
  <title>Help Center — AtlasDays</title>

  <script>(function(){var d=document.documentElement,q=new URLSearchParams(location.search).get('theme'),t=null;if(q==='light'||q==='dark'){t=q;try{sessionStorage.setItem('theme',q)}catch(e){}}else{try{t=sessionStorage.getItem('theme')}catch(e){}if(!t)try{t=localStorage.getItem('theme')}catch(e){}}d.setAttribute('data-theme',t==='light'?'light':'dark')})()</script>
  <style>
    html { background: #0D1117; color-scheme: dark; }
    html[data-theme="light"] { background: #f7f8fa; color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      text-align: center;
      color: #b2b9c5;
    }
    html[data-theme="light"] body { color: #526075; }
    a { color: #4f9dee; }
    html[data-theme="light"] a { color: #246ca8; }
    [hidden] { display: none !important; }
  </style>

  <script>window.AtlasDaysAppAliasTarget = '/help/';
  // Languages this alias has a translated destination for. Add a line
  // when a locale's Help Center ships; the app already sends ?lang=.
  window.AtlasDaysAppAliasLocales = { ja: '/ja/help/' };</script>
  <noscript><meta http-equiv="refresh" content="0; url=/help/" /></noscript>
  <!-- Cloudflare Web Analytics -->
  <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon="{&quot;token&quot;: &quot;1488e163b83a4eee81b63340359b6566&quot;}"></script>
  <!-- End Cloudflare Web Analytics -->
  <script defer src="/assets/js/app-page-alias.js"></script>
</head>
<body>
  <p data-alias-status role="status" hidden>Loading…</p>
  <p data-alias-fallback hidden>
    <span data-alias-message></span>
    <a href="/help/" data-alias-target-link>Help Center</a>
  </p>
</body>
</html>
